name: Build Wear OS APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "15859902"

      - name: Install Android build tools
        run: sdkmanager "build-tools;36.0.0"

      - name: Install Android 17 Cinnamon Bun platform
        shell: bash
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/platform-CinnamonBun_r05.zip"
          unpack="$RUNNER_TEMP/cinnamonbun-platform"
          curl -fL --retry 3 \
            -o "$zip" \
            "https://dl.google.com/android/repository/platform-CinnamonBun_r05.zip"
          echo "e2b204742c79147f694281af9e30fa8d8b7e96eb  $zip" | sha1sum -c -
          rm -rf "$unpack"
          mkdir -p "$unpack"
          unzip -q "$zip" -d "$unpack"
          jar="$(find "$unpack" -type f -name android.jar -print -quit)"
          test -n "$jar"
          platform_dir="$(dirname "$jar")"
          rm -rf "$ANDROID_HOME/platforms/android-CinnamonBun"
          mkdir -p "$ANDROID_HOME/platforms/android-CinnamonBun"
          cp -a "$platform_dir"/. "$ANDROID_HOME/platforms/android-CinnamonBun"/
          test -f "$ANDROID_HOME/platforms/android-CinnamonBun/android.jar"
          cat "$ANDROID_HOME/platforms/android-CinnamonBun/source.properties"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: starintel-wear-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
